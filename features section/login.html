<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="sign-up.css">
      <title>Document</title>
</head>
<body>
      
      <!-- --------------------- Login Section ------------------------ -->
       <section class="login-2sec"> 
<div class="registration-container login-container" id="login-section">
  <section class="form-section">
    <header>
      <div class="icon-section">
        <img src=" signup assests/icon.png" alt="MediAlert Logo" width="25px" />
        <h3>MediAlert</h3>
      </div>
      <h1 class="heading-text">Welcome Back!</h1>
      <p class="subtitle">Login to manage your hospital</p>
    </header>

    <form id="login-form">
      <div class="input-group">
        <label for="login-email">Official Email</label><br />
        <input type="email" id="login-email" placeholder="MediAlert1@gmail.com" required />
      </div>

      <div class="input-group">
        <label for="login-password">Password</label><br />
        <div class="password-wrapper">
          <input type="password" id="login-password" placeholder="••••••••" required />
          <i class="fa-solid fa-eye-slash toggle-icon" id="toggleLoginPassword"></i>
        </div>
        <a href="#" class="forgot-password">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-primary">Login</button>
      <p class="login-footer">Don't have an account? <a href="#" id="show-signup">Sign Up</a></p>
    </form>
  </section>

  <section class="image-section">
    <img src=" signup assests/Onboarding image 1.png" alt="Hospital ambulance illustration" width="500px" />
  </section>
  </section>


  <!-- --------------------- Verification Section ------------------------ -->
   <section class="verification-container">
<div class="registration-container verification-container hidden" id="otp-section">
  <section class="form-section">
    <header>
      <div class="icon-section">
        <img src=" signup assests/icon.png" alt="MediAlert Logo" width="25px" />
        <h3>MediAlert</h3>
      </div>
      <h1 class="heading-text">Verify Email</h1>
      <p class="subtitle">Enter the 4-digit code sent to your email</p>
    </header>

    <div class="otp-input-group">
      <input type="text" maxlength="1" class="otp-box" />
      <input type="text" maxlength="1" class="otp-box" />
      <input type="text" maxlength="1" class="otp-box" />
      <input type="text" maxlength="1" class="otp-box" />
    </div>

    <button class="btn-primary">Verify & Proceed</button>
    <p class="resend-text">Didn't receive code? <a href="#">Resend Code</a></p>
  </section>
</div>



     
</div>
</section>
</body>
</html>
