<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="mobile-container">
  <header class="home-header">
    <div class="user-info">
      <span>Welcome back,</span>
      <h2>John Doe</h2>
    </div>
    <img src="assets/avatar.png" alt="Profile" class="avatar">
  </header>

  <main class="home-content">
    <div class="status-card">
      <div class="status-dot active"></div>
      <p>GPS System Active</p>
    </div>

    <div class="sos-container">
      <div class="pulse-ring"></div>
      <button class="sos-btn">SOS</button>
    </div>
    <p class="sos-hint">Press and hold for 3 seconds to alert help</p>
  </main>

  <nav class="bottom-nav">
    <a href="#" class="nav-item active"><img src="assets/nav-home.svg" alt="Home"></a>
    <a href="#" class="nav-item"><img src="assets/nav-alerts.svg" alt="Alerts"></a>
    <a href="#" class="nav-item"><img src="assets/nav-profile.svg" alt="Profile"></a>
  </nav>
</div>
</body>
</html>
