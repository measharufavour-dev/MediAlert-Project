<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="HomeScreen3&4.CSS" />
    <title>MediAlert SOS</title>
  </head>
  <body>
    <!-- CONFRIM DETAILS (myself Users) -->
    <section>
      <div class="header">
        <img src="SOS assets/arrow.png" alt="" />
        <h2>Confirm Details</h2>
      </div>
      <form action="">
        <div class="inp">
          <label for="FullName">Full Name</label>
          <input type="text" placeholder="Jessica Lawson" />
        </div>
        <div class="inp">
          <label for=" ">Medical Conditions and allergies</label>
          <input
            type="text"
            placeholder="Asthma, Peanut and Penicillin allergy"
          />
        </div>
        <div class="inp">
          <label for=" ">Symptoms</label>
          <input type="text" placeholder="Hard time breathing, weakness" />
        </div>
        <div class="inp">
          <label for=" ">Location</label>
          <input type="text" />
        </div>
        <div class="import">
          <div class="photo-container">
            <p>Upload Photo</p>
          </div>
          <span>Optional</span>
        </div>
      </form>

      <!-------------- End oF Form ------------------>
      <div class="tickboxes-section">
        <div class="tick">
          <input type="checkbox" /> <label>If critical signify</label>
        </div>
        <p>Who Should Receive Emergency</p>
        <div class="side-checkbox">
          <div class="tick">
            <input type="checkbox" /> <label for="">Hospital</label>
          </div>
          <div class="tick">
            <input type="checkbox" /> <label for="">Contacts</label>
          </div>
        </div>
      </div>

      <!-------------- Action-Button ---------------- -->
      <button class="Btn">Save Now</button>
    </section>
  </body>
</html>
