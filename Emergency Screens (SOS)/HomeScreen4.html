  <body>
    <section>
      <main class="header">
        <img src="SOS assets/arrow.png" alt="" />
        <h2>Third Party Details</h2>
      </main>
      <form action="">
        <div class="inp">
          <label for="Full Name"> Full Name</label>
          <input type="text" />
        </div>
        <div class="Contact-details">
          <p>Contact Details (If Available)</p>
          <div class="side-input"></div>
          <div class="inp">
            <label for="Full Name">Contact</label>
            <input type="tel" />
          </div>
        </div>

        <div class="inp">
          <label for="FullName"
            >Medical Conditions and allergies (If available)</label
          >
          <input type="text" />
        </div>
        <div class="inp">
          <label for=" ">Symptoms</label>
          <input type="text" placeholder="Hard time breathing, weakness" />
        </div>
        <div class="inp">
          <label for="">Medical Conditions and allergies (If available)</label>
          <input type="text" />
        </div>

        <div class="inp" >
          <label for="">Location</label>
          <input type="text" />
        </div>
      </form>
      <div class="import">
          <div class="photo-container">
            <p>Upload Photo</p>
          </div>
          <span>Optional</span>
        </div>

      <!-------------- End oF Form ------------------>
      <div class="tickboxes-section">
        <div>
          <input type="checkbox" /> <label for="">If critical signify</label>
        </div>
      </div>
      <!-------------- Action-Button ---------------- -->
      <button class="Btn">Save Now</button>
    </section>
