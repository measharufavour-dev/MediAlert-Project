<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Aid Section</title>
    <link rel="stylesheet" href="firstAid.css" />
  </head>
  <body>
    <!--........ Hero Section with Search Bar -------  -->
    <header>
      <h1>First Aid</h1>
      <div>
        <button>
          <span>Search for help (e.g. burns, choking, CPR)</span>
          <img
            src="firstAid assests/search icon.png"
            alt=" search icon"
            width="15px"
          />
        </button>
      </div>
    </header>
    <!--........ End of Hero Section with Search Bar -------  -->
    <!-- Not sure whats wrong? Section -->
    <section class="parent-container">
      <div class="text">
        <h2>Not sure whats wrong?</h2>
        <p>Quick, step-by-step guides to help you respond to emergencies.</p>
        <button>Check Symptoms</button>
      </div>
      <div class="img">
        <img src="firstAid assests/First aid 2 1.png" alt="" />
      </div>
    </section>
    <!--------------------  End----------------- -->

    <!-- COMMON EMERGENCIES SECTION -->

    <section>
      <h3>COMMON EMERGENCIES</h3>

      <div class="parent-button-con">
        <!-- ------------------1-------------------- -->
        <div class="child">
          <div class="child-img">
            <img src="firstAid assests/heart.png" alt="" />
          </div>
          <div class="child-text">
            <h4>Cardiac Arrest</h4>
            <p>Sudden collapse. unresponsive</p>
          </div>
          <div class="arrow">
            <img src="firstAid assests/arrow.png" alt="" />
          </div>
        </div>

        <!-- --------------------2--------------------- -->
        <div class="child">
          <div class="child-img">
            <img src="firstAid assests/dead --zombie-.png" alt="" />
          </div>
          <div class="child-text">
            <h4>Stroke</h4>
            <p>Slurred speech, weakness</p>
          </div>
          <div class="arrow">
            <img src="firstAid assests/arrow.png" alt="" />
          </div>
        </div>
        <!-- -------------------------3------------------ -->
        <div class="child">
          <div class="child-img">
            <img src="firstAid assests/inhaler-asthma.png" alt="" />
          </div>
          <div class="child-text">
            <h4>Asthma Attack</h4>
            <p>Difficulty breathing, wheezing</p>
          </div>
          <div class="arrow">
            <img src="firstAid assests/arrow.png" alt="" />
          </div>
        </div>
        <!-- -------------------------4------------------ -->
      </div>
    </section>

    <!------------------- End of the Section ---------------------->

    <!---------------- Quick Access Section------------- -->
    <section class="footer">
      <h3>QUICK ACCESS</h3>
      <div class="parent-quick-access-con">
        <!-- ----------1------------- -->
        <div class="child-img-small">
          <img src="firstAid assests/dead --zombie-.png" alt="" />
          <h4>CPR</h4>
        </div>

        <!-- ---------------2------------ -->
        <div class="child-img-small">
          <img src="firstAid assests/lungs.png" alt="" />
          <h4>Choking</h4>
        </div>

        <!-- ----------------3------------- -->
        <div class="child-img-small">
          <img src="firstAid assests/blood.png " alt="" />
          <h4>Severe Bleeding</h4>
        </div>
      </div>
    </section>
    <!------------- End of Section ----------------- -->
    <!------------- Action-Btn---------------- -->
    <section>
      <div class="btn">
      <button>
        <a href="firstAid2.html">
          Browse All <img src="firstAid assests/arrow.png" alt=" search icon"
        /></a>
      </button>
    </div>
    <div class="sos-container">
      <div class="sos-wrapper">
        <!-- The Progress Ring -->
        <svg class="progress-ring" viewBox="0 0 100 100">
          <circle class="ring-bg" cx="50" cy="50" r="80"></circle>
          <circle id="progress-bar" cx="50" cy="50" r="70">SOS</circle>
        </svg>

        <!-- Your Original Button -->
        <button id="sosButton" class="sos-button">
          <img
            src="Emergency Screens (SOS)/SOS assets/SOSBtn.png "
            alt="SOSBtn"
            width="100"
          />
        </button>
      </div>
    </div>
    </section>

  
    <script src="Emergency Screens (SOS)/script.js"></script>
  </body>
</html>
